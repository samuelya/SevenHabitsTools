<app-exercise-page
  [title]="'h2Projects.prompt.title' | transloco"
  [editing]="draft.selected() !== null"
  [editorTitle]="
    (draft.unsaved() ? 'h2Projects.editor.newTitle' : 'h2Projects.editor.editTitle') | transloco
  "
  [editorStatus]="draft.status()"
  (editorClosed)="closeDetail()"
>
  <app-exercise-prompt-card
    intro
    [heading]="'h2Projects.prompt.title' | transloco"
    [prompt]="'h2Projects.prompt.text' | transloco"
    [gloss]="'h2Projects.prompt.glossText' | transloco"
    [chapterReference]="'h2Projects.prompt.chapterReference' | transloco"
    [whyItMatters]="'h2Projects.prompt.whyItMatters' | transloco"
    [guide]="guideContent()"
    [collapsedByDefault]="collapsedByDefault()"
    (exampleTried)="onExampleTried($event)"
  />

  <button mat-flat-button type="button" class="add-button" (click)="onAdd()">
    <mat-icon aria-hidden="true">add</mat-icon>
    {{ 'h2Projects.list.addButton' | transloco }}
  </button>

  <!-- A group with no items shows no heading; the Under way list stays for the empty state while
       nothing is finished either. -->
  @if (underWayItems().length) {
    <h2 class="group-legend">{{ 'h2Projects.group.underWayLegend' | transloco }}</h2>
  }
  @if (underWayItems().length || !finishedItems().length) {
    <app-exercise-list
      [items]="underWayItems()"
      [selectedId]="itemId()"
      initialSort="none"
      [searchLabel]="'h2Projects.list.searchLabel' | transloco"
      [emptyMessage]="'h2Projects.list.empty' | transloco"
      [noMatchMessage]="'h2Projects.list.noMatch' | transloco"
      [deletable]="true"
      (itemSelected)="select($event)"
      (deleteRequested)="onItemDeleted($event)"
    />
  }

  @if (finishedItems().length) {
    <section class="finished-group" aria-labelledby="finished-toggle">
      <h2 class="group-legend">
        <button
          mat-button
          type="button"
          id="finished-toggle"
          class="finished-toggle"
          aria-controls="finished-list"
          [attr.aria-expanded]="finishedExpanded()"
          (click)="toggleFinished()"
        >
          <mat-icon aria-hidden="true">{{
            finishedExpanded() ? 'expand_less' : 'expand_more'
          }}</mat-icon>
          {{ 'h2Projects.group.finishedLegend' | transloco }}
        </button>
      </h2>
      <div id="finished-list" [hidden]="!finishedExpanded()">
        @if (finishedExpanded()) {
          <app-exercise-list
            [items]="finishedItems()"
            [selectedId]="itemId()"
            initialSort="none"
            [searchable]="false"
            [searchLabel]="'h2Projects.list.searchLabel' | transloco"
            [emptyMessage]="'h2Projects.list.empty' | transloco"
            [deletable]="true"
            (itemSelected)="select($event)"
            (deleteRequested)="onItemDeleted($event)"
          />
        }
      </div>
    </section>
  }

  <div editor>
    @if (draft.selected(); as item) {
      <app-project-item-form
        [item]="item"
        (changed)="onItemChanged(item.id, $event)"
        (deleted)="onItemDeleted(item.id)"
      />
    }
  </div>

  <div footer class="summary-section">
    @if (summary(); as summary) {
      <app-projects-summary [summary]="summary" />
    }
    <app-done-toggle
      [done]="done()"
      [completedAt]="completedAt()"
      [disabled]="!readyToMarkDone()"
      [checklist]="checklist()"
      (toggled)="onToggleDone()"
    />
  </div>
</app-exercise-page>
