<section class="backup-section" id="backup">
  <h2>{{ 'settings.backup.title' | transloco }}</h2>

  <div class="backup-section__row">
    <div class="backup-section__buttons">
      <button mat-stroked-button type="button" [disabled]="busy()" (click)="onExportClick()">
        {{ 'settings.backup.export' | transloco }}
      </button>
      @if (canShare) {
        <button mat-stroked-button type="button" [disabled]="busy()" (click)="onShareClick()">
          {{ 'settings.backup.share' | transloco }}
        </button>
      }
    </div>
    <p class="backup-section__hint">{{ 'settings.backup.exportHint' | transloco }}</p>
  </div>

  <div class="backup-section__row">
    <button mat-stroked-button type="button" [disabled]="busy()" (click)="triggerImport()">
      {{ 'settings.backup.import' | transloco }}
    </button>
    <p class="backup-section__hint">{{ 'settings.backup.importHint' | transloco }}</p>
    <input
      #fileInput
      type="file"
      accept=".json,application/json"
      hidden
      [attr.aria-label]="'settings.backup.import' | transloco"
      (change)="onFileSelected($event)"
    />
    @if (parseError(); as error) {
      <p class="backup-section__error" role="alert">{{ error }}</p>
    }
  </div>

  <div class="backup-section__row">
    <label for="backup-reminder-days">{{ 'settings.backup.reminderLabel' | transloco }}</label>
    <select
      id="backup-reminder-days"
      [value]="backup.value().reminderDays"
      (change)="onReminderDaysChange($event)"
    >
      <option value="0">{{ 'settings.backup.reminderOff' | transloco }}</option>
      <option value="1">{{ 'settings.backup.reminderDaily' | transloco }}</option>
      <option value="7">{{ 'settings.backup.reminderWeekly' | transloco }}</option>
      <option value="30">{{ 'settings.backup.reminderMonthly' | transloco }}</option>
    </select>
  </div>
</section>
