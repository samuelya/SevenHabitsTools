<app-exercise-page
  [title]="'h2Centres.prompt.title' | transloco"
  [editing]="draft.selected() !== null"
  [editorTitle]="editorTitle() ?? ('h2Centres.list.newButton' | transloco)"
  [editorStatus]="draft.status()"
  (editorClosed)="closeEditor()"
>
  <app-exercise-prompt-card
    intro
    [heading]="'h2Centres.prompt.title' | transloco"
    [prompt]="'h2Centres.prompt.text' | transloco"
    [gloss]="'h2Centres.prompt.glossText' | transloco"
    [chapterReference]="'h2Centres.prompt.chapterReference' | transloco"
    [whyItMatters]="'h2Centres.prompt.whyItMatters' | transloco"
    [guide]="guideContent()"
    [collapsedByDefault]="collapsedByDefault()"
  />

  <button mat-flat-button type="button" class="add-button" (click)="onNew()">
    <mat-icon aria-hidden="true">add</mat-icon>
    {{ 'h2Centres.list.newButton' | transloco }}
  </button>

  <app-assessment-history-list
    [items]="historyItems()"
    [selectedId]="itemId()"
    [emptyMessage]="'h2Centres.list.empty' | transloco"
    [deletable]="true"
    (itemSelected)="select($event)"
    (deleteRequested)="onDeleted($event)"
  />

  <div editor>
    @if (draft.selected(); as assessment) {
      @switch (mode()) {
        @case ('read') {
          <app-centres-result
            [assessment]="assessment"
            [previous]="previous()"
            [centreLabels]="centreLabels()"
            [principleKeyLabels]="principleLabels()"
            (editRequested)="onEdit()"
          />
        }
        @case ('edit') {
          <app-guided-stepper
            [steps]="steps()"
            [selectedIndex]="stepIndex()"
            (selectedIndexChange)="stepIndex.set($event)"
          >
            <ng-template appGuidedStep="step1">
              <div class="step-body">
                <p class="field-prompt">{{ 'h2Centres.step1.prompt' | transloco }}</p>
                @for (centre of centres; track centre) {
                  <app-centre-card
                    [centre]="centre"
                    [rating]="storedRating(assessment, centre)"
                    (ratingChange)="onRated(centre, $event)"
                  />
                }
              </div>
            </ng-template>
            <ng-template appGuidedStep="step2">
              <div class="step-body">
                <app-centres-factors
                  [centreLabel]="topCentreLabel()"
                  [factors]="assessment.factors"
                  (factorChange)="onFactorChanged($event)"
                />
              </div>
            </ng-template>
            <ng-template appGuidedStep="step3">
              <div class="step-body">
                <app-centres-principles
                  [principles]="assessment.principles"
                  [keyLabels]="principleLabels()"
                  (principlesChange)="onPrinciplesChanged($event)"
                />
                <button mat-flat-button type="button" class="save-button" (click)="onSave()">
                  {{ 'h2Centres.editor.saveButton' | transloco }}
                </button>
              </div>
            </ng-template>
          </app-guided-stepper>
        }
      }
    }
  </div>

  <div footer class="summary-section">
    <app-done-toggle
      [done]="done()"
      [completedAt]="completedAt()"
      [disabled]="!readyToMarkDone()"
      [checklist]="checklist()"
      (toggled)="onToggleDone()"
    />
  </div>
</app-exercise-page>
