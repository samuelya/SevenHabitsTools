<mat-drawer-container class="exercise-detail" [class.handset]="handset()" autosize>
  <mat-drawer-content class="list-pane">
    <ng-content select="[list]" />
  </mat-drawer-content>
  <mat-drawer
    class="detail-drawer"
    position="end"
    [mode]="handset() ? 'over' : 'side'"
    [opened]="hasDetail()"
    [autoFocus]="false"
    (openedChange)="onOpenedChange($event)"
  >
    <button
      #closeButton
      mat-icon-button
      type="button"
      class="close-button"
      [attr.aria-label]="'exerciseKit.detail.close' | transloco"
      (click)="closed.emit()"
    >
      <mat-icon class="flip-in-rtl" aria-hidden="true">arrow_back</mat-icon>
    </button>
    <ng-content select="[detail]" />
  </mat-drawer>
</mat-drawer-container>
