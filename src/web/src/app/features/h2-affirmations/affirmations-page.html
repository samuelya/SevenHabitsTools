<app-exercise-page
  [title]="'h2Affirmations.prompt.title' | transloco"
  [editing]="draft.selected() !== null"
  [editorTitle]="
    (draft.unsaved() ? 'h2Affirmations.editor.newTitle' : 'h2Affirmations.editor.editTitle')
      | transloco
  "
  [editorStatus]="draft.status()"
  (editorClosed)="closeDetail()"
>
  <app-exercise-prompt-card
    intro
    [heading]="'h2Affirmations.prompt.title' | transloco"
    [prompt]="'h2Affirmations.prompt.text' | transloco"
    [gloss]="'h2Affirmations.prompt.glossText' | transloco"
    [chapterReference]="'h2Affirmations.prompt.chapterReference' | transloco"
    [whyItMatters]="'h2Affirmations.prompt.whyItMatters' | transloco"
    [guide]="guideContent()"
    [collapsedByDefault]="collapsedByDefault()"
    (exampleTried)="onExampleTried($event)"
  />

  <button mat-flat-button type="button" class="add-button" (click)="onAdd()">
    <mat-icon aria-hidden="true">add</mat-icon>
    {{ 'h2Affirmations.list.addButton' | transloco }}
  </button>

  @if (archivedItems().length) {
    <h2 class="group-legend">{{ 'h2Affirmations.group.activeLegend' | transloco }}</h2>
  }
  <app-exercise-list
    [items]="activeItems()"
    [selectedId]="itemId()"
    initialSort="none"
    [searchLabel]="'h2Affirmations.list.searchLabel' | transloco"
    [emptyMessage]="'h2Affirmations.list.empty' | transloco"
    [noMatchMessage]="'h2Affirmations.list.noMatch' | transloco"
    [deletable]="true"
    (itemSelected)="select($event)"
    (actionRequested)="onPractise($event)"
    (deleteRequested)="onItemDeleted($event)"
  />

  @if (archivedItems().length) {
    <section class="archived-group" aria-labelledby="archived-toggle">
      <h2 class="group-legend">
        <button
          mat-button
          type="button"
          id="archived-toggle"
          class="archived-toggle"
          aria-controls="archived-list"
          [attr.aria-expanded]="archivedExpanded()"
          (click)="toggleArchived()"
        >
          <mat-icon aria-hidden="true">{{
            archivedExpanded() ? 'expand_less' : 'expand_more'
          }}</mat-icon>
          {{ 'h2Affirmations.group.archivedLegend' | transloco }}
        </button>
      </h2>
      <div id="archived-list" [hidden]="!archivedExpanded()">
        @if (archivedExpanded()) {
          <app-exercise-list
            [items]="archivedItems()"
            [selectedId]="itemId()"
            initialSort="none"
            [searchable]="false"
            [searchLabel]="'h2Affirmations.list.searchLabel' | transloco"
            [emptyMessage]="'h2Affirmations.list.empty' | transloco"
            [deletable]="true"
            (itemSelected)="select($event)"
            (deleteRequested)="onItemDeleted($event)"
          />
        }
      </div>
    </section>
  }

  <div editor>
    @if (draft.selected(); as item) {
      <app-affirmation-item-form
        [item]="item"
        [saved]="!draft.unsaved()"
        (changed)="onItemChanged(item.id, $event)"
        (archivedChange)="onArchivedChange(item.id, $event)"
        (deleted)="onItemDeleted(item.id)"
      />
    }
  </div>

  <div footer class="summary-section">
    @if (summary(); as summary) {
      <app-affirmations-summary [summary]="summary" />
    }
    <app-done-toggle
      [done]="done()"
      [completedAt]="completedAt()"
      [disabled]="!readyToMarkDone()"
      [checklist]="checklist()"
      (toggled)="onToggleDone()"
    />
  </div>
</app-exercise-page>
