<h1 class="page-heading">Exercise UI kit</h1>

<section>
  <h2>Prompt card</h2>
  <app-exercise-prompt-card
    prompt="List the things in your life you can directly control, versus the things you can only be concerned about."
    chapterReference="Habit 1"
    whyItMatters="Focusing your energy on what you can influence is the core of proactive behavior."
  />
</section>

<section>
  <h2>Guided stepper</h2>
  <app-guided-stepper
    [steps]="steps"
    [selectedIndex]="stepIndex()"
    (selectedIndexChange)="stepIndex.set($event)"
  >
    <ng-template appGuidedStep="identify">
      <p>Step 1: identify the roles in your life.</p>
    </ng-template>
    <ng-template appGuidedStep="reflect">
      <p>Step 2: reflect on how you want to show up in each one.</p>
    </ng-template>
  </app-guided-stepper>
</section>

<section>
  <h2>Exercise page scaffold</h2>
  <app-exercise-page
    title="Circle of Influence"
    [editing]="editing()"
    [editorTitle]="editorTitle()"
    [editorStatus]="editorStatus()"
    (editorClosed)="closeEditor()"
    (done)="closeEditor()"
  >
    <app-exercise-prompt-card
      intro
      prompt="List the things in your life you can directly control, versus the things you can only be concerned about."
      chapterReference="Habit 1"
      whyItMatters="Focusing your energy on what you can influence is the core of proactive behavior."
    />

    <button mat-flat-button type="button" class="add-button">
      <mat-icon aria-hidden="true">add</mat-icon>
      Add item
    </button>
    <app-exercise-list
      [items]="items"
      [selectedId]="editingId()"
      searchLabel="Search items"
      emptyMessage="No items yet."
      (itemSelected)="edit($event)"
    />

    <div editor>
      <p appEditorInitialFocus tabindex="-1">
        Editor content for the selected exercise would render here.
      </p>
    </div>

    <div footer class="footer-content">
      <span>2 of 3 done</span>
      <app-done-toggle [done]="done()" [completedAt]="completedAt()" (toggled)="onToggle()" />
    </div>
  </app-exercise-page>
</section>

<section>
  <h2>Reflection editor</h2>
  <app-reflection-editor
    [value]="reflection()"
    label="What did you learn?"
    [updatedAt]="reflectionUpdatedAt()"
    (valueChange)="onReflectionChange($event)"
  />
</section>

<section>
  <h2>Done state</h2>
  <app-done-toggle [done]="done()" [completedAt]="completedAt()" (toggled)="onToggle()" />
</section>
