<div class="data-error-page">
  <h1 class="page-heading">{{ 'data.error.title' | transloco }}</h1>
  <p>{{ status.messageKey() ?? 'data.bootstrap.corrupt' | transloco }}</p>

  @if (!confirmingReset()) {
    <div class="data-error-page__actions">
      <button mat-flat-button type="button" (click)="retry()">
        {{ 'data.error.retry' | transloco }}
      </button>
      @if (canExport()) {
        <button mat-stroked-button type="button" (click)="exportRaw()">
          {{ 'data.error.exportRaw' | transloco }}
        </button>
      }
      <button mat-stroked-button type="button" (click)="triggerImport()">
        {{ 'data.error.importBackup' | transloco }}
      </button>
      <button mat-button type="button" (click)="confirmReset()">
        {{ 'data.error.reset' | transloco }}
      </button>
    </div>
    <input
      #importInput
      type="file"
      accept=".json,application/json"
      hidden
      [attr.aria-label]="'data.error.importBackup' | transloco"
      (change)="onImportFileSelected($event)"
    />
    @if (importError(); as error) {
      <p class="data-error-page__error" role="alert">{{ error }}</p>
    }
  } @else {
    <div class="data-error-page__confirm" aria-live="polite">
      <p>{{ 'data.error.resetConfirm' | transloco }}</p>
      <div class="data-error-page__actions">
        <button #cancelButton mat-stroked-button type="button" (click)="cancelReset()">
          {{ 'data.error.cancel' | transloco }}
        </button>
        <button mat-flat-button color="warn" type="button" (click)="reset()">
          {{ 'data.error.confirmReset' | transloco }}
        </button>
      </div>
    </div>
  }
</div>
