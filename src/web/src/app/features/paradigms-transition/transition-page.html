<app-exercise-page
  [title]="'paradigmsTransition.prompt.title' | transloco"
  [editing]="hasDetail()"
  [editorTitle]="
    (isNewScript() ? 'paradigmsTransition.editor.newTitle' : 'paradigmsTransition.editor.editTitle')
      | transloco
  "
  [editorStatus]="editorStatus()"
  (editorClosed)="closeDetail()"
>
  <app-exercise-prompt-card
    intro
    [prompt]="'paradigmsTransition.prompt.text' | transloco"
    [chapterReference]="'paradigmsTransition.prompt.chapterReference' | transloco"
    [whyItMatters]="'paradigmsTransition.prompt.whyItMatters' | transloco"
  />

  <button mat-flat-button type="button" class="add-button" (click)="onAddScript()">
    <mat-icon aria-hidden="true">add</mat-icon>
    {{ 'paradigmsTransition.list.addButton' | transloco }}
  </button>
  <app-exercise-list
    [items]="items()"
    [selectedId]="itemId()"
    [searchLabel]="'paradigmsTransition.list.searchLabel' | transloco"
    [emptyMessage]="'paradigmsTransition.list.empty' | transloco"
    [noMatchMessage]="'paradigmsTransition.list.noMatch' | transloco"
    [deletable]="true"
    (itemSelected)="select($event)"
    (deleteRequested)="onItemDeleted($event)"
  />

  <div editor>
    @if (selectedScript(); as script) {
      <app-transition-item-form
        [script]="script"
        (changed)="onItemChanged(script.id, $event)"
        (deleted)="onItemDeleted(script.id)"
      />
    }
  </div>

  <div footer class="summary-section">
    @if (summary(); as summary) {
      <app-transition-summary [summary]="summary" />
    }
    <app-done-toggle
      [done]="done()"
      [completedAt]="completedAt()"
      [disabled]="!readyToMarkDone()"
      [checklist]="checklist()"
      (toggled)="onToggleDone()"
    />
  </div>
</app-exercise-page>
