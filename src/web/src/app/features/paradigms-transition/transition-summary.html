<mat-card class="transition-summary" appearance="outlined">
  <mat-card-content>
    <p class="count total">
      {{ 'paradigmsTransition.summary.total' | appPlural: summary().total }}
    </p>
    <p class="count">
      {{ 'paradigmsTransition.summary.stopped' | appPlural: summary().stopped }}
    </p>
    <p class="count">
      {{ 'paradigmsTransition.summary.rewritten' | appPlural: summary().rewritten }}
    </p>
  </mat-card-content>
</mat-card>
