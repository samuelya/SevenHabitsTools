<app-exercise-page
  [title]="'paradigmsPcBalance.prompt.title' | transloco"
  [editing]="hasDetail()"
  [editorTitle]="'paradigmsPcBalance.editor.title' | transloco"
  [editorStatus]="editorStatus()"
  (editorClosed)="closeDetail()"
>
  <app-exercise-prompt-card
    intro
    [prompt]="'paradigmsPcBalance.prompt.text' | transloco"
    [chapterReference]="'paradigmsPcBalance.prompt.chapterReference' | transloco"
    [whyItMatters]="'paradigmsPcBalance.prompt.whyItMatters' | transloco"
    [collapsedByDefault]="collapsedByDefault()"
  />

  <button mat-flat-button type="button" class="add-button" (click)="onNewAudit()">
    <mat-icon aria-hidden="true">add</mat-icon>
    {{ 'paradigmsPcBalance.history.newAudit' | transloco }}
  </button>

  <app-assessment-history-list
    [items]="historyItems()"
    [selectedId]="itemId()"
    [emptyMessage]="'paradigmsPcBalance.history.empty' | transloco"
    [deletable]="true"
    (itemSelected)="select($event)"
    (deleteRequested)="onAuditDeleted($event)"
  />

  <div editor>
    @if (selectedAudit(); as audit) {
      <app-pc-balance-audit-form
        #auditForm
        [audit]="audit"
        (changed)="onAuditChanged(audit.id, $event)"
        (reflectionChanged)="onReflectionChanged($event, auditForm)"
      />
    }
  </div>

  <div footer class="summary-section">
    @if (summary(); as summary) {
      <app-pc-balance-summary [summary]="summary" />
    }
    <app-done-toggle
      [done]="done()"
      [completedAt]="completedAt()"
      [disabled]="!readyToMarkDone()"
      [checklist]="checklist()"
      (toggled)="onToggleDone()"
    />
  </div>
</app-exercise-page>
