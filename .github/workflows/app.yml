name: App

on:
  push:
    branches: [main]
    paths:
      - src/**
      - .github/workflows/app.yml
  # No paths filter: every PR must run this workflow so `Detect projects` can report
  # a check (even if skipped) instead of leaving a required check permanently "expected".
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/samuelya/sevenhabitstools-api
  WEB_IMAGE: ghcr.io/samuelya/sevenhabitstools-web
  RESOURCE_GROUP: rg-sevenhabitstools-prod

jobs:
  detect:
    # Name is referenced by the "Protect main" branch ruleset's required status checks;
    # renaming this job requires updating the ruleset too.
    name: Detect projects
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.detect.outputs.api }}
      web: ${{ steps.detect.outputs.web }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git diff` against the base branch works on pull_request;
          # push/workflow_dispatch don't need it, but the extra fetch is cheap and this
          # keeps the step unconditional.
          fetch-depth: 0

      - name: Detect api and web projects
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          api_exists=false
          web_exists=false
          if [[ -d src/api ]] && [[ -n "$(find src/api -name '*.csproj' -print -quit)" ]]; then
            api_exists=true
          fi
          if [[ -f src/web/package.json ]]; then
            web_exists=true
          fi
          if [[ "$api_exists" == false && "$web_exists" == false ]]; then
            echo "::notice::No api (src/api/**/*.csproj) or web (src/web/package.json) project yet; nothing to build."
          fi

          api="$api_exists"
          web="$web_exists"

          # pull_request has no paths filter (see the `on:` trigger above), so narrow here:
          # a project only counts as changed when it exists AND its files, or this workflow
          # file, changed against the PR base. That keeps docs-only PRs green without
          # running the .NET/Angular pipelines, while still reporting a (skipped) check.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
            api=false
            web=false
            if [[ "$api_exists" == true ]] && grep -qE '^(src/api/|\.github/workflows/app\.yml)' <<<"$changed"; then
              api=true
            fi
            if [[ "$web_exists" == true ]] && grep -qE '^(src/web/|\.github/workflows/app\.yml)' <<<"$changed"; then
              web=true
            fi
          fi

          echo "api=$api web=$web"
          {
            echo "api=$api"
            echo "web=$web"
          } >> "$GITHUB_OUTPUT"

  api:
    # Name is referenced by the "Protect main" branch ruleset's required status checks;
    # renaming this job requires updating the ruleset too.
    name: API build and test
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Locate solution
        id: sln
        run: |
          target="$(find src -maxdepth 1 \( -name '*.slnx' -o -name '*.sln' \) -print -quit)"
          echo "path=${target:-src/api}" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore "${{ steps.sln.outputs.path }}"

      - name: Build
        run: dotnet build "${{ steps.sln.outputs.path }}" --no-restore -warnaserror

      - name: Test
        # global.json opts into Microsoft.Testing.Platform (required by xunit.v3 4.x on .NET 10),
        # which takes --solution/--project instead of a positional path.
        run: |
          target="${{ steps.sln.outputs.path }}"
          case "$target" in
            *.sln|*.slnx) dotnet test --solution "$target" --no-build ;;
            *) dotnet test --project "$target" --no-build ;;
          esac

      - uses: docker/setup-buildx-action@v4

      # Verifies the Dockerfile on every PR; the images job pushes it from main.
      - name: Build api image (no push)
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/api/Dockerfile
          push: false
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=api

  web:
    # Name is referenced by the "Protect main" branch ruleset's required status checks;
    # renaming this job requires updating the ruleset too.
    name: Web lint, test, build and e2e
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm install -g npm@11.19.1
      - run: npm -v
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test --if-present
      - run: npm run build

      # Playwright smoke suite (issue #29): served from the production build, no Docker.
      - run: npx playwright install chromium

      - name: E2E smoke suite
        run: npm run e2e

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/web/playwright-report
            src/web/test-results
          retention-days: 7
          if-no-files-found: ignore

  images:
    name: Build and push images
    needs: [detect, api, web]
    if: ${{ !cancelled() && needs.detect.outputs.api == 'true' && needs.detect.outputs.web == 'true' && needs.api.result == 'success' && needs.web.result == 'success' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push api
        uses: docker/build-push-action@v7
        with:
          context: src
          file: src/api/Dockerfile
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ${{ env.API_IMAGE }}:${{ github.sha }}
            ${{ env.API_IMAGE }}:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push web
        uses: docker/build-push-action@v7
        with:
          context: src/web
          file: src/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ github.sha }}
            ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Check package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in sevenhabitstools-api sevenhabitstools-web; do
            visibility="$(gh api "/users/samuelya/packages/container/$name" --jq .visibility 2>/dev/null || echo unknown)"
            if [[ "$visibility" != public ]]; then
              echo "::warning::Package $name visibility is '$visibility'. Make it public (GitHub > Packages > $name > Package settings > Change visibility) so Azure Container Apps can pull it without credentials."
            fi
          done

  azure-not-configured:
    name: Azure not configured
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' && (vars.AZURE_CLIENT_ID == '' || vars.DEPLOY_ENABLED != 'true') }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped deploy
        run: echo "::notice::Deploy skipped. Set repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and DEPLOY_ENABLED=true to deploy to Azure."

  deploy:
    name: Deploy to prod
    needs: images
    if: ${{ !cancelled() && needs.images.result == 'success' && vars.AZURE_CLIENT_ID != '' && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Container App
        id: deploy
        env:
          MS_OAUTH_CLIENT_ID: ${{ vars.MS_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_SECRETS_CONFIGURED: ${{ vars.OAUTH_SECRETS_CONFIGURED == 'true' }}
        run: |
          fqdn="$(az deployment group create \
            --name "app-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/app.bicep \
            --parameters \
              apiImage="$API_IMAGE:${{ github.sha }}" \
              webImage="$WEB_IMAGE:${{ github.sha }}" \
              apiProbePath=/healthz \
              msOAuthClientId="$MS_OAUTH_CLIENT_ID" \
              googleOAuthClientId="$GOOGLE_OAUTH_CLIENT_ID" \
              oauthSecretsConfigured="$OAUTH_SECRETS_CONFIGURED" \
            --query properties.outputs.fqdn.value \
            --output tsv)"
          echo "fqdn=$fqdn" >> "$GITHUB_OUTPUT"
          echo "### App URL: https://$fqdn" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        env:
          FQDN: ${{ steps.deploy.outputs.fqdn }}
        run: curl --fail --silent --show-error --retry 10 --retry-delay 10 --retry-all-errors "https://$FQDN/healthz"
