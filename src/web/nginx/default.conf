# Serves the Angular build on localhost:8081 inside the Container App.
# The api container (YARP) is the only public ingress and adds the security headers.
server {
    listen 8081;
    listen [::]:8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Behind the proxy: never leak the internal host or port in redirects.
    absolute_redirect off;

    # Compressed files produced at build time (*.gz) are served as-is; everything else is gzipped on the fly.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # Build output file names carry a content hash (e.g. main-X4D5JBA2.js, media/font-K6BLXDDP.woff2).
    location ~* "-[A-Za-z0-9_-]{8}\.(?:js|mjs|css|woff2?|ttf|otf|png|jpe?g|gif|svg|webp|avif|ico)$" {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The app shell and the service worker manifest must always be revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = /ngsw.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Deep links fall back to the app shell; other un-hashed files are revalidated.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
