name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/infra.yml
  # No paths filter: every PR must run this workflow so `Lint and build Bicep` can report
  # a check (even if skipped) instead of leaving a required check permanently "expected".
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_LOCATION: australiaeast
  RESOURCE_GROUP: rg-sevenhabitstools-prod
  CONTAINER_APP: ca-sevenhabitstools-prod
  PLACEHOLDER_API_IMAGE: mcr.microsoft.com/dotnet/samples:aspnetapp
  PLACEHOLDER_WEB_IMAGE: mcr.microsoft.com/k8se/quickstart:latest

jobs:
  detect:
    name: Detect infra changes
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.detect.outputs.infra }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git diff` against the base branch works on pull_request;
          # push/workflow_dispatch don't need it, but the extra fetch is cheap and this
          # keeps the step unconditional.
          fetch-depth: 0

      - name: Detect infra changes
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          infra=true

          # pull_request has no paths filter (see the `on:` trigger above), so narrow here:
          # only require Bicep lint/build when infra files, or this workflow, changed against
          # the PR base. That keeps non-infra PRs green without running `az bicep`.
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            changed="$(git diff --name-only "origin/$GITHUB_BASE_REF...HEAD")"
            infra=false
            if grep -qE '^(infra/|\.github/workflows/infra\.yml)' <<<"$changed"; then
              infra=true
            fi
          fi

          echo "infra=$infra"
          echo "infra=$infra" >> "$GITHUB_OUTPUT"

  validate:
    # Name is referenced by the "Protect main" branch ruleset's required status checks;
    # renaming this job requires updating the ruleset too.
    name: Lint and build Bicep
    needs: detect
    if: needs.detect.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bicep
        run: az bicep install

      - name: Lint
        run: |
          az bicep lint --file infra/main.bicep
          az bicep lint --file infra/app.bicep

      - name: Build
        run: |
          az bicep build --file infra/main.bicep --outdir "${{ runner.temp }}"
          az bicep build --file infra/app.bicep --outdir "${{ runner.temp }}"
          az bicep build-params --file infra/main.bicepparam --outfile "${{ runner.temp }}/main.parameters.json"

  azure-not-configured:
    name: Azure not configured
    if: vars.AZURE_CLIENT_ID == ''
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped Azure jobs
        run: echo "::notice::Azure jobs skipped. Set repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and AZURE_SUBSCRIPTION_ID to enable what-if and deploy."

  what-if:
    name: What-if (subscription)
    needs: validate
    # Fork PRs cannot mint an OIDC token for this repository.
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam

  deploy:
    name: Deploy infrastructure
    needs: validate
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: prod-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy subscription resources
        run: |
          az deployment sub create \
            --name "infra-${{ github.run_id }}" \
            --location "$AZURE_LOCATION" \
            --template-file infra/main.bicep \
            --parameters infra/main.bicepparam \
            --output none

      - name: Resolve current images
        id: images
        run: |
          current_image() {
            az resource show \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_APP" \
              --resource-type Microsoft.App/containerApps \
              --query "properties.template.containers[?name=='$1'].image | [0]" \
              --output tsv 2>/dev/null || true
          }
          api_image="$(current_image api)"
          web_image="$(current_image web)"
          api_image="${api_image:-$PLACEHOLDER_API_IMAGE}"
          web_image="${web_image:-$PLACEHOLDER_WEB_IMAGE}"
          if [[ "$api_image" == ghcr.io/* ]]; then
            probe_path=/healthz
          else
            probe_path=/
          fi
          echo "api=$api_image web=$web_image probe=$probe_path"
          {
            echo "api=$api_image"
            echo "web=$web_image"
            echo "probe=$probe_path"
          } >> "$GITHUB_OUTPUT"

      - name: Deploy Container App
        env:
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
          API_PROBE_PATH: ${{ steps.images.outputs.probe }}
          MS_OAUTH_CLIENT_ID: ${{ vars.MS_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          OAUTH_SECRETS_CONFIGURED: ${{ vars.OAUTH_SECRETS_CONFIGURED == 'true' }}
        run: |
          url="$(az deployment group create \
            --name "app-${{ github.run_id }}" \
            --resource-group "$RESOURCE_GROUP" \
            --template-file infra/app.bicep \
            --parameters \
              apiImage="$API_IMAGE" \
              webImage="$WEB_IMAGE" \
              apiProbePath="$API_PROBE_PATH" \
              msOAuthClientId="$MS_OAUTH_CLIENT_ID" \
              googleOAuthClientId="$GOOGLE_OAUTH_CLIENT_ID" \
              oauthSecretsConfigured="$OAUTH_SECRETS_CONFIGURED" \
            --query properties.outputs.url.value \
            --output tsv)"
          echo "App URL: $url"
          echo "### App URL: $url" >> "$GITHUB_STEP_SUMMARY"
