<mat-card class="affirmations-summary" appearance="outlined">
  <mat-card-content>
    <h2 class="title">{{ 'h2Affirmations.summary.title' | transloco }}</h2>
    <p class="days">
      {{ 'h2Affirmations.summary.daysText' | appPlural: summary().days }}
    </p>
    @if (summary().streak > 0) {
      <p class="streak">
        {{ 'h2Affirmations.summary.streakText' | appPlural: summary().streak }}
      </p>
    }
  </mat-card-content>
</mat-card>
