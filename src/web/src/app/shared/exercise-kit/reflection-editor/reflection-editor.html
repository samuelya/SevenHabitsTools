<div class="reflection-editor">
  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ label() }}</mat-label>
    <textarea
      matInput
      rows="6"
      [value]="draft()"
      (input)="onInput($event)"
      [attr.aria-describedby]="status() ? 'reflection-status' : null"
    ></textarea>
  </mat-form-field>
  @if (status(); as status) {
    <p id="reflection-status" class="status" aria-live="polite">
      {{
        (status === 'saving' ? 'exerciseKit.editor.saving' : 'exerciseKit.editor.saved') | transloco
      }}
    </p>
  }
</div>
