<mat-card class="teach-summary" appearance="outlined">
  <mat-card-content>
    <p class="count total">
      {{
        'paradigmsTeach.summary.shared' | appPlural: summary().shared : { total: summary().total }
      }}

      {{ 'paradigmsTeach.summary.overdue' | appPlural: summary().overdue }}
    </p>
  </mat-card-content>
</mat-card>
