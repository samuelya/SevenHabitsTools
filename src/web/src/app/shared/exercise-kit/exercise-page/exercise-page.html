<h1 class="visually-hidden" tabindex="-1">{{ title() }}</h1>

<div class="scaffold" [class.editing]="editing()" [class.handset]="handset()">
  <div #bodyColumn class="body" [attr.inert]="bodyInert() ? '' : null">
    <div class="intro-slot"><ng-content select="[intro]" /></div>
    <div class="content-slot"><ng-content /></div>
  </div>

  @if (showFooter()) {
    <div class="footer-slot"><ng-content select="[footer]" /></div>
  }

  @if (editing()) {
    <!-- `tabindex="-1"`: not a tab stop, just enough for `interactive-supports-focus` since
         `(keydown.escape)` here only ever needs a focused *descendant* (a field) to bubble up. -->
    <!-- The trap is the handset panel's replacement for what the old drawer layout got from
         `MatDrawer` for free: the panel covers the app's toolbar and bottom navigation instead of
         containing them, and `bodyInert` only takes this page's own body out of the tab order, so
         without it Tab reaches the shell's controls hidden underneath. On desktop the list column
         beside the editor is meant to stay reachable, so the trap is off there. -->
    <div class="editor-panel" tabindex="-1" [cdkTrapFocus]="bodyInert()" (keydown.escape)="close()">
      <header class="editor-header">
        @if (handset()) {
          <button
            mat-icon-button
            type="button"
            class="editor-close"
            [attr.aria-label]="'exerciseKit.detail.close' | transloco"
            (click)="close()"
          >
            <mat-icon class="flip-in-rtl" aria-hidden="true">arrow_back</mat-icon>
          </button>
        } @else {
          <button
            mat-icon-button
            type="button"
            class="editor-close"
            [attr.aria-label]="'exerciseKit.editor.close' | transloco"
            (click)="close()"
          >
            <mat-icon class="flip-in-rtl" aria-hidden="true">close</mat-icon>
          </button>
        }
        <h2 #editorHeading tabindex="-1" class="editor-title">{{ editorTitle() }}</h2>
        <span class="editor-status" aria-live="polite">
          @if (editorStatus() === 'saving') {
            {{ 'exerciseKit.editor.saving' | transloco }}
          } @else if (editorStatus() === 'saved') {
            {{ 'exerciseKit.editor.saved' | transloco }}
          }
        </span>
      </header>
      <div class="editor-body"><ng-content select="[editor]" /></div>
    </div>
  }
</div>
